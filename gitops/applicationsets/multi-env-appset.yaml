apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-platform-workloads
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: staging
            cluster: https://k8s-staging.internal:6443
            revision: main
          - env: prod
            cluster: https://k8s-prod.internal:6443
            revision: v1.4.0
  template:
    metadata:
      name: "omnichannel-{{env}}"
    spec:
      project: platform-core
      source:
        repoURL: https://github.com/ejpinangog/k8s-gitops-edge-platform.git
        targetRevision: "{{revision}}"
        path: "workloads/ai-inference"
      destination:
        server: "{{cluster}}"
        namespace: ai-platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
